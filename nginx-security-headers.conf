# Angular/Ionic SPA — applied to all responses from the frontend container.
# Anti-clickjacking: X-Frame-Options (legacy) + frame-ancestors in CSP (modern).
add_header X-Frame-Options "DENY" always;
# CSP: no cross-domain JS; SRI required for scripts (see angular.json subresourceIntegrity).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; script-src-elem 'self'; script-src-attr 'none'; require-sri-for script; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; worker-src 'self'; manifest-src 'self';" always;
# MIME sniffing protection
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Restrict cross-domain policy files (Flash/PDF legacy vectors)
add_header X-Permitted-Cross-Domain-Policies "none" always;
