<ion-app>
  <ion-menu
    menuId="mainMenu"
    side="start"
    contentId="main-content"
    type="overlay"
    [disabled]="!(auth.isAuthenticated$ | async)"
    style="--width:300px"
  >
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
        <ion-buttons slot="end">
          <ion-button class="menu-action-btn" fill="clear" (click)="closeMenu()">
            <ion-icon slot="icon-only" name="chevron-forward-outline"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-item button (click)="navigate('/home')">Kalendarz</ion-item>
        <ion-item button (click)="navigate('/hermonogram')">Harmonogram</ion-item>
        <ion-item button (click)="navigate('/konflikty')">Konflikty</ion-item>
        <ion-item button (click)="navigate('/profile')">Profil</ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
