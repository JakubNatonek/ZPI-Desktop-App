<ion-app>
  <ion-menu menuId="mainMenu" side="start" contentId="main-content" type="overlay"
    [disabled]="!(auth.isAuthenticated$ | async)" style="--width:300px">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
        <ion-buttons slot="end">
          <ion-button class="menu-action-btn" fill="clear" (click)="closeMenu()">
            <ion-icon slot="icon-only" name="chevron-forward-outline"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
      <ion-toolbar *ngIf="auth.isAuthenticated$ | async" class="role-toolbar">
        <ion-title size="small">Rola: {{ auth.roleLabel }}</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-item lines="none">
          <ion-label>Tryb ciemny</ion-label>
          <ion-toggle slot="end" [checked]="selectedTheme === 'dark'" (ionChange)="onThemeChange($event.detail.checked)"></ion-toggle>
        </ion-item>
      </ion-list>

      <ion-list>
        <ion-item button (click)="navigate('/home')">Wykładowcy</ion-item>
        <ion-item button *ngIf="auth.role !== 'lecturer'" (click)="navigate('/hermonogram')">Harmonogram</ion-item>
        <ion-item button *ngIf="auth.role !== 'lecturer'" (click)="navigate('/konflikty')">Konflikty</ion-item>
        <ion-item button *ngIf="auth.role === 'admin'" (click)="navigate('/sale')">Sale</ion-item>
        <ion-item button *ngIf="auth.role === 'admin'" (click)="navigate('/subjects')">Przedmioty</ion-item>
        <ion-item button *ngIf="auth.role === 'admin'" (click)="navigate('/teaching-loads')">Przydzial godzin</ion-item>
        <ion-item button *ngIf="auth.role === 'admin' || auth.role === 'lecturer'" (click)="navigate('/subject-preferences')">Preferencje przedmiotów</ion-item>
        <ion-item button *ngIf="auth.role === 'admin'" (click)="navigate('/admin/users/new')">Dodaj użytkownika</ion-item>
        <ion-item button *ngIf="auth.role === 'admin'" (click)="navigate('/admin/unavailability-notes')">Notatki o niedostępności</ion-item>
        <ion-item button *ngIf="auth.role === 'admin' || auth.role === 'rapla_editor'" (click)="navigate('/audit-logs')">Historia zmian</ion-item>
        <ion-item button (click)="navigate('/profile')">Profil</ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

  <app-chat *ngIf="(auth.isAuthenticated$ | async) && !(auth.isRestoringSession$ | async)"></app-chat>
</ion-app>
