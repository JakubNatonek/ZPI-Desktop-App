<!-- Chat bubble trigger -->
<div class="chat-bubble" (click)="toggle()" [class.open]="isOpen()" title="Czat">
  <span class="chat-bubble__badge" *ngIf="hasUnreadMessages()"></span>
  <svg *ngIf="!isOpen()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
  </svg>
  <svg *ngIf="isOpen()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
  </svg>
</div>
<div class="chat-unread-toast" *ngIf="showUnreadToast()">Masz nowe wiadomości</div>

<!-- Chat panel -->
<div class="chat-panel" [class.chat-panel--open]="isOpen()">
  <app-chat-panel-header
    [view]="view()"
    [selectedUser]="selectedUser()"
    [selectedRoom]="selectedRoom()"
    [getInitials]="getInitials.bind(this)"
    (back)="goBack()"
    (close)="close()"
  ></app-chat-panel-header>

  <app-chat-panel-tabs
    [view]="view()"
    [activeTab]="activeTab()"
    (tabChange)="setTab($event)"
  ></app-chat-panel-tabs>

  <!-- ─── CONTACTS VIEW ─────────────────────────────── -->
  <app-chat-contacts-view
    *ngIf="view() === 'contacts'"
    [searchQuery]="searchQuery"
    [searchResults]="searchResults()"
    [isSearching]="isSearching()"
    [directContacts]="directContacts"
    [getInitials]="getInitials.bind(this)"
    [getLastMessage]="getLastMessage.bind(this)"
    [isLastMessageUnread]="isLastMessageUnread.bind(this)"
    (searchQueryChange)="searchQuery = $event"
    (search)="onSearch($event)"
    (openConversation)="openConversation($event)"
  ></app-chat-contacts-view>


  <!-- ─── CONVERSATION VIEW ─────────────────────────── -->
  <ng-container *ngIf="view() === 'conversation' && selectedUser() as user">
    <div class="chat-panel__body chat-panel__body--messages" #messagesContainer>
      <div class="chat-messages">
        <ng-container *ngIf="conversations[user.user_id] && conversations[user.user_id].length > 0; else noMessages">
          <div
            class="chat-message"
            *ngFor="let msg of conversations[user.user_id]"
            [class.chat-message--own]="msg.isOwn"
          >
            <div class="chat-message__bubble">{{ msg.content }}</div>
            <div class="chat-message__time">{{ formatTime(msg.timestamp) }}</div>
          </div>
        </ng-container>
        <ng-template #noMessages>
          <div class="chat-empty">Napisz pierwszą wiadomość</div>
        </ng-template>
      </div>
    </div>
    <div class="chat-input-bar">
      <textarea
        class="chat-input"
        [(ngModel)]="messageInput"
        (keydown)="handleKeydown($event)"
        placeholder="Napisz wiadomość…"
        rows="1"
      ></textarea>
      <button class="chat-send-btn" (click)="sendMessage()" [disabled]="!messageInput.trim() || isEncrypting()">
        <ng-container *ngIf="!isEncrypting(); else sending">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </ng-container>
        <ng-template #sending>
          <div class="chat-search__spinner" aria-hidden="true"></div>
        </ng-template>
      </button>
    </div>
  </ng-container>

  <!-- ─── ROOMS VIEW ────────────────────────────────── -->
  <app-chat-rooms-view
    *ngIf="view() === 'rooms'"
    [rooms]="rooms"
    [getLastRoomMessage]="getLastRoomMessage.bind(this)"
    (showCreateRoom)="showCreateRoom()"
    (openRoom)="openRoom($event)"
  ></app-chat-rooms-view>

  <!-- ─── ROOM CHAT VIEW ───────────────────────────── -->
  <ng-container *ngIf="view() === 'room-chat' && selectedRoom() as room">
    <div class="chat-panel__body chat-panel__body--messages" #messagesContainer>
      <div class="chat-messages">
        <ng-container *ngIf="roomMessages[room.id] && roomMessages[room.id].length > 0; else noRoomMessages">
          <div
            class="chat-message"
            *ngFor="let msg of roomMessages[room.id]"
            [class.chat-message--own]="msg.isOwn"
          >
            <div class="chat-message__sender" *ngIf="!msg.isOwn">{{ msg.senderName }}</div>
            <div class="chat-message__bubble">{{ msg.content }}</div>
            <div class="chat-message__time">{{ formatTime(msg.timestamp) }}</div>
          </div>
        </ng-container>
        <ng-template #noRoomMessages>
          <div class="chat-empty">Brak wiadomości w tym pokoju</div>
        </ng-template>
      </div>
    </div>
    <div class="chat-input-bar">
      <textarea
        class="chat-input"
        [(ngModel)]="messageInput"
        (keydown)="handleKeydown($event)"
        placeholder="Napisz wiadomość…"
        rows="1"
      ></textarea>
      <button class="chat-send-btn" (click)="sendMessage()" [disabled]="!messageInput.trim() || isEncrypting()">
        <ng-container *ngIf="!isEncrypting(); else sendingRoom">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </ng-container>
        <ng-template #sendingRoom>
          <div class="chat-search__spinner" aria-hidden="true"></div>
        </ng-template>
      </button>
    </div>
  </ng-container>

  <!-- ─── CREATE ROOM VIEW ─────────────────────────── -->
  <app-chat-create-room-view
    *ngIf="view() === 'create-room'"
    [newRoomName]="newRoomName"
    [newRoomMembers]="newRoomMembers()"
    [availableUsers]="availableUsers"
    [isMemberSelected]="isMemberSelected.bind(this)"
    [getInitials]="getInitials.bind(this)"
    (newRoomNameChange)="newRoomName = $event"
    (toggleRoomMember)="toggleRoomMember($event)"
    (createRoom)="createRoom()"
  ></app-chat-create-room-view>

</div>
