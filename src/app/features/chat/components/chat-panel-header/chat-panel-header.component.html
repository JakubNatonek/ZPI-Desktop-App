<div class="chat-panel__header">
  <ng-container *ngIf="view === 'contacts' || view === 'rooms'">
    <span class="chat-panel__title">Czat</span>
  </ng-container>

  <ng-container *ngIf="view === 'conversation' && selectedUser as user">
    <button class="chat-back-btn" (click)="back.emit()" title="Wróć">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </button>
    <div class="chat-panel__user-info">
      <div class="chat-avatar chat-avatar--sm">{{ getInitials(user) }}</div>
      <div class="chat-panel__title">{{ user.first_name }} {{ user.last_name }}</div>
    </div>
  </ng-container>

  <ng-container *ngIf="view === 'room-chat' && selectedRoom as room">
    <button class="chat-back-btn" (click)="back.emit()" title="Wróć">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </button>
    <div>
      <div class="chat-panel__title"># {{ room.name }}</div>
      <div class="chat-panel__subtitle">{{ room.members.length }} uczestników</div>
    </div>
    <button type="button" class="chat-room-menu-btn" (click)="options.emit()" title="Opcje czatu" aria-label="Opcje czatu">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="5" r="1.8"></circle>
        <circle cx="12" cy="12" r="1.8"></circle>
        <circle cx="12" cy="19" r="1.8"></circle>
      </svg>
    </button>
  </ng-container>

  <ng-container *ngIf="view === 'create-room'">
    <button class="chat-back-btn" (click)="back.emit()" title="Wróć">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </button>
    <span class="chat-panel__title">Nowy pokój</span>
  </ng-container>

  <button class="chat-close-btn" (click)="close.emit()" title="Zamknij">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
    </svg>
  </button>
</div>
