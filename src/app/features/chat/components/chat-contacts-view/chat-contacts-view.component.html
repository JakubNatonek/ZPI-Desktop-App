<div class="chat-panel__body">
  <div class="chat-search">
    <input
      type="text"
      class="chat-search__input"
      placeholder="Szukaj użytkowników..."
      [ngModel]="searchQuery"
      (ngModelChange)="onSearchChange($event)"
    />
    <svg class="chat-search__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
    <div class="chat-search__spinner" *ngIf="isSearching"></div>
  </div>

  <div class="chat-list" *ngIf="searchQuery.trim()">
    <div class="chat-list__section-title">Wyniki wyszukiwania</div>
    <div *ngIf="searchResults.length === 0 && !isSearching" class="chat-empty">
      Brak wyników
    </div>
    <div class="chat-list__item" *ngFor="let user of searchResults" (click)="openConversation.emit(user)">
      <div class="chat-avatar">{{ getInitials(user) }}</div>
      <div class="chat-list__info">
        <div class="chat-list__name">{{ user.first_name }} {{ user.last_name }}</div>
      </div>
    </div>
  </div>

  <div class="chat-list" *ngIf="!searchQuery.trim()">
    <div class="chat-list__section-title">Ostatnie rozmowy</div>
    <div *ngIf="directContacts.length === 0" class="chat-empty">
      Brak rozmów. Wyszukaj użytkownika, aby rozpocząć czat.
    </div>
    <div class="chat-list__item" *ngFor="let user of directContacts" (click)="openConversation.emit(user)">
      <div class="chat-avatar">{{ getInitials(user) }}</div>
      <div class="chat-list__info">
        <div class="chat-list__name">{{ user.first_name }} {{ user.last_name }}</div>
        <div class="chat-list__preview" [class.chat-list__preview--unread]="isLastMessageUnread(user.user_id)">
          {{ getLastMessage(user.user_id) }}
        </div>
      </div>
    </div>
  </div>
</div>
