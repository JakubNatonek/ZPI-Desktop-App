<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button class="menu-nav-btn" autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Słownik typów zajęć</ion-title>
    <ion-buttons slot="end" class="app-header-user-actions">
      <ion-button class="toolbar-nav-btn" fill="clear" (click)="navigateToList()">
        <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
        Lista przedmiotów
      </ion-button>
      <ion-button class="toolbar-nav-btn" fill="clear" (click)="navigateToCreateSubject()">
        <ion-icon slot="start" name="add-circle-outline"></ion-icon>
        Nowy przedmiot
      </ion-button>
      <ion-chip class="role-chip" outline>
        <ion-label>{{ userRoleLabel }}</ion-label>
      </ion-chip>
      <span class="toolbar-username">{{ userDisplayName }}</span>
      <ion-avatar class="ion-margin-start app-user-avatar" role="button" tabindex="0"
        (click)="toggleProfileMenu($event)">
        <img [src]="auth.avatarUrl" alt="Avatar" />
      </ion-avatar>

      <ion-popover [isOpen]="isProfileMenuOpen" [event]="profileMenuEvent" [dismissOnSelect]="true" side="bottom"
        alignment="end" (didDismiss)="closeProfileMenu()">
        <ng-template>
          <ion-list lines="none">
            <ion-item button detail="false" (click)="openSettings()">Ustawienia</ion-item>
            <ion-item button detail="false" class="logout-item" (click)="logout()">Wyloguj</ion-item>
          </ion-list>
        </ng-template>
      </ion-popover>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="dict-page-content">
  <div class="dict-page-wrapper">

    <!-- Nagłówek strony -->
    <div class="dict-page-header">
      <h1 class="dict-page-title">Słownik typów zajęć</h1>
      <p class="dict-page-subtitle">Zarządzaj typami zajęć używanymi przy tworzeniu przedmiotów.</p>
    </div>

    <ion-progress-bar type="indeterminate" *ngIf="isLoading" class="page-loader"></ion-progress-bar>

    <div class="form-message error-message" *ngIf="errorMessage || dictionaryErrorMessage">
      <ion-icon name="alert-circle-outline"></ion-icon>
      {{ errorMessage || dictionaryErrorMessage }}
    </div>

    <div class="dict-grid" *ngIf="!isLoading">
      <!-- Typy zajęć -->
      <div class="dict-card">
        <div class="dict-card-header">
          <h2 class="dict-heading">Typy zajęć</h2>
          <ion-button size="small" class="btn-add-dict" [disabled]="isUpdatingDictionary" (click)="createActivity()">
            <ion-icon slot="start" name="add-outline"></ion-icon>
            Dodaj
          </ion-button>
        </div>

        <div class="dict-list" *ngIf="activityOptions.length > 0">
          <div class="dict-item" *ngFor="let activity of activityOptions">
            <span class="dict-item-name">{{ activity.name }}</span>
            <div class="dict-item-actions">
              <button class="icon-btn" title="Edytuj" [disabled]="isUpdatingDictionary"
                (click)="editActivity(activity)">
                <ion-icon name="pencil-outline"></ion-icon>
              </button>
              <button class="icon-btn danger" title="Usuń" [disabled]="isUpdatingDictionary"
                (click)="deleteActivity(activity)">
                <ion-icon name="trash-outline"></ion-icon>
              </button>
            </div>
          </div>
        </div>

        <p class="dict-empty" *ngIf="activityOptions.length === 0">Brak wpisów.</p>
      </div>
    </div>

  </div>
</ion-content>
