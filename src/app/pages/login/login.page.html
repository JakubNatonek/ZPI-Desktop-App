<ion-content class="login-view">
  <div class="login-layout">

    <!-- Panel lewy – branding -->
    <div class="brand-panel">
      <div class="brand-content">
        <img class="brand-logo" src="assets/icon/logo-ans.png" alt="Logo ANS" />
        <h1 class="brand-title">System Zarządzania&nbsp;Uczelnią</h1>
        <p class="brand-tagline">ANS Nowy Sącz</p>
        <div class="brand-divider"></div>
        <p class="brand-desc">
          Platforma wspierająca zarządzanie harmonogramami,<br>
          wykazami ocen i komunikacją akademicką.
        </p>
      </div>
      <p class="brand-footer">© 2026 ANS Nowy Sącz</p>
    </div>

    <!-- Panel prawy – formularz -->
    <div class="form-panel">
      <div class="form-wrapper">
        <h2 class="form-title">Logowanie</h2>
        <p class="form-subtitle">Wprowadź dane swojego konta</p>

        <div class="field-group">
          <label class="field-label" for="loginInput">Login</label>
          <div class="input-shell">
            <ion-icon name="mail-outline"></ion-icon>
            <ion-input id="loginInput" type="text" placeholder="login" [(ngModel)]="login" (keyup.enter)="submit()"
              required>
            </ion-input>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="passwordInput">Hasło</label>
          <div class="input-shell">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <ion-input id="passwordInput" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••"
              [(ngModel)]="password" (keyup.enter)="submit()" required>
            </ion-input>
            <button type="button" class="toggle-password" (click)="togglePassword()" tabindex="-1">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <div *ngIf="error" class="error-message">
          <ion-icon name="mail-outline" style="display:none"></ion-icon>
          {{ error }}
        </div>

        <ion-button expand="block" class="submit-btn" [disabled]="isLoading" (click)="submit()">
          <span *ngIf="!isLoading">Zaloguj się</span>
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        </ion-button>
      </div>
    </div>

  </div>
</ion-content>
