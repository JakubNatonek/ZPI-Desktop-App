<ion-content class="ion-padding" scroll-y="false">
  <div class="login-container">
    <div class="login-box">
      <div class="logo-container">
        <img src="assets/icon/favicon.png" alt="Logo ANS" class="logo" />
        <h1>Wymagana zmiana hasła</h1>
        <p>Twoje hasło jest jednorazowe. Musisz je zmienić przy pierwszym logowaniu.</p>
      </div>

      <div class="form-container">
        <ion-item class="input-item">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            type="password"
            placeholder="Nowe hasło"
            [(ngModel)]="newPassword"
            (keyup.enter)="changePassword()"
          ></ion-input>
        </ion-item>

        <ion-item class="input-item">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            type="password"
            placeholder="Potwierdź nowe hasło"
            [(ngModel)]="confirmPassword"
            (keyup.enter)="changePassword()"
          ></ion-input>
        </ion-item>

        <div class="error-message" *ngIf="error">
          {{ error }}
        </div>

        <div class="success-message" *ngIf="success">
          {{ success }}
        </div>

        <ion-button expand="block" class="login-button" (click)="changePassword()">
          Zmień hasło i kontynuuj
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
