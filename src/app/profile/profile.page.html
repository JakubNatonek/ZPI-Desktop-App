<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button class="menu-nav-btn" autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Profil</ion-title>
    <ion-buttons slot="end">
      <ion-avatar class="user-avatar" role="button" tabindex="0" (click)="toggleProfileMenu($event)">
        <img [src]="avatarUrl || 'https://ionicframework.com/docs/img/demos/avatar.svg'" alt="Avatar użytkownika">
      </ion-avatar>

      <ion-popover [isOpen]="isProfileMenuOpen" [event]="profileMenuEvent" [dismissOnSelect]="true" side="bottom"
        alignment="end" (didDismiss)="closeProfileMenu()">
        <ng-template>
          <ion-list lines="none">
            <ion-item button detail="false" class="logout-item" (click)="logout()">Wyloguj</ion-item>
          </ion-list>
        </ng-template>
      </ion-popover>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="profile-layout">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Zdjęcie profilowe</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <div class="avatar-section">
          <ion-avatar class="avatar-large">
            <img [src]="avatarUrl || 'https://ionicframework.com/docs/img/demos/avatar.svg'"
              alt="Aktualne zdjęcie profilowe">
          </ion-avatar>
          <ion-button fill="outline" (click)="triggerAvatarUpload(avatarInput)">Zmień zdjęcie</ion-button>
          <input #avatarInput type="file" accept="image/*" hidden (change)="onAvatarFileSelected($event)">
        </div>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header>
        <ion-card-title>Zmiana hasła</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-label position="stacked">Aktualne hasło</ion-label>
          <ion-input type="password" [(ngModel)]="currentPassword"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Nowe hasło</ion-label>
          <ion-input type="password" [(ngModel)]="newPassword"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Powtórz nowe hasło</ion-label>
          <ion-input type="password" [(ngModel)]="confirmPassword"></ion-input>
        </ion-item>
        <ion-button expand="block" class="ion-margin-top" (click)="submitPasswordChange()">Zapisz hasło</ion-button>
        <p class="password-message" *ngIf="passwordMessage">{{ passwordMessage }}</p>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header>
        <ion-card-title>Motyw aplikacji</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item lines="none">
          <ion-label>Tryb ciemny</ion-label>
          <ion-toggle slot="end" [checked]="selectedTheme === 'dark'"
            (ionChange)="onThemeChange($event.detail.checked)"></ion-toggle>
        </ion-item>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
